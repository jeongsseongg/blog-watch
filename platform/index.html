<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b4f8a">
  <title>벨로르 | 명품시계 비교견적 플랫폼</title>
  <meta name="description" content="명품시계 비교견적·매입 플랫폼. 사진 한 번에 여러 업체 입찰가를 비교하세요.">
  <style>
    :root{
      color-scheme:light;
      --ink:#171717; --muted:#6b7280; --line:#e7e9ee; --soft:#f6f7f9;
      --accent:#0b4f8a; --accent-2:#0a6bc4; --accent-soft:#eaf3fb;
      --danger:#b3261e; --ok:#17633a;
      --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.06);
      --maxw:1040px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0}
    body{
      font-family:"Apple SD Gothic Neo","Malgun Gothic",Pretendard,system-ui,sans-serif;
      color:var(--ink);background:var(--soft);line-height:1.6;
      padding-bottom:env(safe-area-inset-bottom);
    }
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    img{max-width:100%}

    /* ---- top nav ---- */
    #nav{
      display:flex;align-items:center;gap:18px;padding:12px 20px;
      background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(12px);
      border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;flex-wrap:wrap;
    }
    .brand{font-weight:800;font-size:21px;color:var(--ink);letter-spacing:-.3px}
    .brand:hover{text-decoration:none}
    .links{display:flex;gap:6px;flex:1;flex-wrap:wrap}
    .links a{color:var(--muted);font-size:14.5px;padding:7px 12px;border-radius:9px;transition:.15s}
    .links a:hover{background:var(--soft);text-decoration:none;color:var(--ink)}
    .links a.active{color:var(--accent);background:var(--accent-soft);font-weight:700}
    .auth{display:flex;align-items:center;gap:10px}
    .who{font-size:12.5px;color:var(--muted)} .who em{font-style:normal;color:var(--accent);font-weight:600}

    /* ---- layout ---- */
    main#view{width:min(var(--maxw),calc(100% - 32px));margin:0 auto;padding:26px 0 80px}
    h1{font-size:30px;margin:0 0 10px;letter-spacing:-.5px}
    h2{font-size:21px;margin:26px 0 14px;letter-spacing:-.3px}
    h3{font-size:16.5px;margin:0 0 6px}
    h4{margin:14px 0 8px;font-size:14.5px;color:var(--muted)}
    .muted{color:var(--muted)} .small{font-size:12.5px}
    /* 앱처럼 부드럽게 등장 */
    @keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    #view>*{animation:viewIn .24s cubic-bezier(.2,.7,.3,1) both}

    /* ---- buttons ---- */
    .btn{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#fff;border:0;border-radius:11px;
      padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
    .btn:hover{filter:brightness(1.05)} .btn:active{transform:translateY(1px)}
    .btn[disabled]{opacity:.6;cursor:default}
    .btn-lg{padding:14px 24px;font-size:16px;width:100%}
    .btn-sm{background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s}
    .btn-sm:hover{background:var(--soft)}
    .btn-sm.danger,.danger{color:var(--danger)}
    .btn-ghost{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 15px;font-size:14px;cursor:pointer;color:var(--ink)}
    .btn-ghost:hover{background:var(--soft)}

    /* ---- cards ---- */
    .card{border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;background:#fff;box-shadow:var(--shadow)}
    .card.err{border-color:var(--danger);color:var(--danger)}
    .form-card{max-width:440px;margin:22px auto}
    .form-card label{display:block;margin:14px 0;font-size:13.5px;font-weight:600;color:#374151}
    .form-card input,.form-card select,.form-card textarea,.bid-form input{
      width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:10px;
      font-size:15px;font-family:inherit;font-weight:400;background:#fff;transition:.15s}
    .form-card input:focus,.form-card select:focus,.form-card textarea:focus,.bid-form input:focus{
      outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
    input[type=file]{padding:9px;font-size:13px}

    /* ---- hero ---- */
    .hero{background:linear-gradient(135deg,#0b4f8a,#0a6bc4);color:#fff;border-radius:20px;padding:46px 32px;text-align:center;margin-bottom:26px;box-shadow:var(--shadow)}
    .hero h1{color:#fff} .hero p{color:#dceaf7;font-size:17px;margin:0 0 22px}
    .hero .btn{background:#fff;color:var(--accent)}

    /* ---- grid / listing ---- */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
    .listing img,.listing .noimg{width:100%;height:160px;object-fit:cover;border-radius:11px;margin-bottom:11px}
    .listing .noimg{background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
    .listing{transition:.15s} .listing:hover{transform:translateY(-2px)}
    .price{font-weight:800;font-size:18px;color:var(--accent);margin:4px 0}

    /* ---- photo gallery / preview ---- */
    .gallery{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
    .gallery img{width:88px;height:88px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
    .preview{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
    .preview img{width:64px;height:64px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}

    /* ---- rows / tables ---- */
    .row{display:flex;gap:10px;align-items:center}.row.between{justify-content:space-between;flex-wrap:wrap}
    table.bids{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
    table.bids th,table.bids td{border-bottom:1px solid var(--line);padding:11px 8px;text-align:left}
    table.bids th{color:var(--muted);font-weight:600;font-size:12.5px}

    /* ---- tags ---- */
    .tag{font-size:11.5px;padding:3px 10px;border-radius:20px;background:var(--soft);color:var(--muted);font-weight:600}
    .tag-open,.tag-on_sale{background:var(--accent-soft);color:var(--accent)}
    .tag-awarded{background:#e6f5ec;color:var(--ok)}
    .tag-sold,.tag-closed,.tag-hidden{background:#fbeae9;color:var(--danger)}

    /* ---- bid form ---- */
    .bid-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .bid-form input{flex:1;min-width:130px;width:auto;margin-top:0}
    .bidded{background:var(--accent-soft);padding:11px 14px;border-radius:10px;color:var(--accent);font-weight:600}

    /* ---- notifications ---- */
    .bell{position:relative;background:transparent;border:0;font-size:21px;cursor:pointer;line-height:1}
    .badge{position:absolute;top:-5px;right:-9px;background:var(--danger);color:#fff;font-size:10.5px;
      font-weight:700;border-radius:20px;padding:1px 6px;display:none;align-items:center}
    .notif{padding:14px 18px}
    .notif.unread{border-left:4px solid var(--accent);background:var(--accent-soft)}

    /* ---- stats ---- */
    .stats{display:flex;gap:14px;flex-wrap:wrap;margin:18px 0}
    .stat{flex:1;min-width:110px;border:1px solid var(--line);border-radius:var(--radius);padding:20px;text-align:center;background:#fff;box-shadow:var(--shadow)}
    .stat b{display:block;font-size:30px;color:var(--accent);font-weight:800} .stat span{font-size:13px;color:var(--muted)}

    /* ---- misc ---- */
    .loading{color:var(--muted);padding:50px;text-align:center}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:13px 22px;border-radius:12px;
      color:#fff;font-size:14px;z-index:100;box-shadow:0 8px 28px rgba(0,0,0,.22);animation:viewIn .2s ease}
    .toast-ok{background:var(--ink)} .toast-err{background:var(--danger)}

    /* ---- mobile ---- */
    @media (max-width:640px){
      #nav{gap:10px;padding:10px 14px}
      .brand{font-size:19px;width:100%}
      .links{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
      .links a{white-space:nowrap}
      .auth{margin-left:auto}
      .who{display:none}
      h1{font-size:25px} .hero{padding:34px 20px}
      main#view{padding:18px 0 70px}
    }
  </style>
</head>
<body>
  <header id="nav"></header>
  <main id="view"></main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
