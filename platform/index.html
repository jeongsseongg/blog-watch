<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>벨로르 | 명품시계 비교견적 플랫폼</title>
  <meta name="description" content="명품시계 비교견적·매입 플랫폼. 사진 한 장으로 여러 업체의 입찰가를 한 번에 비교하세요.">
  <style>
    :root{
      color-scheme:light;
      --ink:#171717; --muted:#646464; --line:#dedede; --soft:#f6f6f6;
      --accent:#0b4f8a; --accent-soft:#eaf3fb; --danger:#8a1f11; --ok:#17633a;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif;color:var(--ink);background:#fff;line-height:1.6}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    /* nav */
    #nav{display:flex;align-items:center;gap:20px;padding:14px 24px;border-bottom:2px solid var(--ink);position:sticky;top:0;background:#fff;z-index:50;flex-wrap:wrap}
    .brand{font-weight:800;font-size:22px;color:var(--ink)}
    .links{display:flex;gap:16px;flex:1;flex-wrap:wrap}
    .links a{color:var(--muted);font-size:15px}
    .links a.active{color:var(--ink);font-weight:700}
    .auth{display:flex;align-items:center;gap:12px}
    .who{font-size:13px;color:var(--muted)} .who em{font-style:normal;color:var(--accent)}
    /* layout */
    main#view{width:min(1080px,calc(100% - 40px));margin:0 auto;padding:32px 0 64px}
    h1{font-size:32px;margin:0 0 8px} h2{font-size:22px;border-bottom:1px solid var(--line);padding-bottom:8px;margin:28px 0 16px}
    h3{font-size:17px;margin:0 0 6px} h4{margin:14px 0 8px}
    .muted{color:var(--muted)} .small{font-size:13px}
    /* buttons */
    .btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer}
    .btn:hover{opacity:.92} .btn-lg{padding:13px 22px;font-size:16px}
    .btn-sm{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:5px 12px;font-size:13px;cursor:pointer}
    .btn-sm.danger,.danger{color:var(--danger)}
    .btn-ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer;color:var(--ink)}
    /* cards */
    .card{border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;background:#fff}
    .card.err{border-color:var(--danger);color:var(--danger)}
    .form-card{max-width:460px;margin:24px auto}
    .form-card label{display:block;margin:12px 0;font-size:14px;font-weight:600}
    .form-card input,.form-card select,.form-card textarea,.bid-form input{width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;font-weight:400}
    /* hero */
    .hero{background:var(--accent-soft);border-radius:16px;padding:40px;text-align:center;margin-bottom:24px}
    .hero p{color:var(--muted);font-size:17px;margin:0 0 18px}
    /* grid */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
    .listing img,.listing .noimg{width:100%;height:150px;object-fit:cover;border-radius:8px;margin-bottom:10px}
    .listing .noimg{background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--muted)}
    .price{font-weight:800;font-size:18px;color:var(--accent)}
    .thumb{max-width:200px;border-radius:8px;margin:8px 0}
    /* rows */
    .row{display:flex;gap:10px;align-items:center}.row.between{justify-content:space-between}
    /* tables */
    table.bids{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
    table.bids th,table.bids td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left}
    table.bids th{color:var(--muted);font-weight:600}
    /* tags */
    .tag{font-size:12px;padding:2px 9px;border-radius:20px;background:var(--soft);color:var(--muted)}
    .tag-open,.tag-on_sale{background:var(--accent-soft);color:var(--accent)}
    .tag-awarded{background:#e6f5ec;color:var(--ok)}
    .tag-sold,.tag-closed,.tag-hidden{background:#f0e6e4;color:var(--danger)}
    /* bid form */
    .bid-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .bid-form input{flex:1;min-width:140px;width:auto}
    .bidded{background:var(--soft);padding:10px;border-radius:8px}
    /* notifications */
    .bell{position:relative;background:transparent;border:0;font-size:20px;cursor:pointer}
    .badge{position:absolute;top:-4px;right:-8px;background:var(--danger);color:#fff;font-size:11px;border-radius:20px;padding:1px 6px;display:none}
    .notif.unread{border-left:4px solid var(--accent);background:var(--accent-soft)}
    /* stats */
    .stats{display:flex;gap:14px;flex-wrap:wrap;margin:16px 0}
    .stat{flex:1;min-width:120px;border:1px solid var(--line);border-radius:12px;padding:18px;text-align:center}
    .stat b{display:block;font-size:28px;color:var(--accent)} .stat span{font-size:13px;color:var(--muted)}
    /* misc */
    .loading{color:var(--muted);padding:40px;text-align:center}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:10px;color:#fff;font-size:14px;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.18)}
    .toast-ok{background:var(--ok)} .toast-err{background:var(--danger)}
  </style>
</head>
<body>
  <header id="nav"></header>
  <main id="view"></main>

  <!-- Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
